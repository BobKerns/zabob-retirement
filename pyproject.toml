[project]
name = "zabob-retirement"
# publish.yml checks a release tag against it.
version = "1.0.0rc1"
description = "Zabob Retirement: a retirement simulator for your future, with scenario comparison and Monte Carlo ensembles"
# PyPI shows this; README.md's relative links and images only work on GitHub.
readme = "PYPI.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["retirement", "retirement simulator", "financial planning", "monte carlo", "taxes", "roth conversion"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: Jupyter",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "click>=8.5.1",
  "gitpython>=3.2.1",
  "ipywidgets>=8.1.9",
  "matplotlib>=3.11.2",
  # Sixel images (#777); matplotlib needs it too
  "pillow>=13.0.0",
  "pandas>=3.1.1",
  "rich>=15.0.0",
  "ipykernel>=7.4.0",
  "jupyterlab>=4.6.6",
  # 2.21.0 breaks under tornado >= 6.5.9: every /static request 500s (#62)
  "jupyter-server>=2.21.1",
  "numpy>=2.5.5",
  "scipy>=1.18.1",
  "truststore>=0.10.5",
  "markdown-it-py>=4.3.0",
  "anywidget>=0.11.0",
  "playwright>=1.65.2",
  "pyyaml>=6.0.3",
  "jinja2>=3.1.6",
  "ofxtools>=1.1.1",
]

[project.optional-dependencies]
# `sim jupyter hub` (#766): a JupyterHub serving the household's logins, on
# Linux and macOS. Its proxy, configurable-http-proxy, comes from npm.
hub = [
  "jupyterhub>=6.2.0; sys_platform != 'win32'",
]

[project.scripts]
analysis = "zabob.retirement.cli:main"
amazon = "zabob.retirement.amazon.cli:amazon_group_command"
sim = "zabob.retirement.sim.cli:sim_group_command"

[project.urls]
Homepage = "https://github.com/BobKerns/zabob-retirement"
Documentation = "https://github.com/BobKerns/zabob-retirement/blob/main/docs/user-guide.md"
Videos = "https://www.youtube.com/channel/UCQnUgmsanqEqAj1I-0i7vOA/"
Issues = "https://github.com/BobKerns/zabob-retirement/issues"

[dependency-groups]
dependabot = [
    "bleach>=6.4.0",
    "pillow>=13.0.0",
]
dev = [
  "nbstripout>=0.9.1",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.5",
  "pytest-xdist>=3.8.0",
  "ty>=0.0.104",
  "pytest-split>=0.11.0",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zabob"]

# hatch_build.py ships templates/, notebooks/, prototype_data/ and plugins/ in the wheel
# and stamps the commit it was built from (#662).
[tool.hatch.build.hooks.custom]

# What the wheel is built from: uv build makes the wheel out of the sdist.
[tool.hatch.build.targets.sdist]
only-include = ["src", "templates", "notebooks", "prototype_data", "plugins", "hatch_build.py", "README.md", "PYPI.md", "LICENSE"]

# Every Python process in the venv (JupyterLab server, kernels, CLI runs, and
# libraries that bring their own certifi contexts) verifies TLS with the OS
# trust store (#86). A .pth line runs at interpreter startup, so the injection
# needs no import from our code. The project is only ever installed editable by
# `uv sync`; hatchling copies force-include files into that install as well.
[tool.hatch.build.targets.wheel.force-include]
"src/pth/zabob_retirement_truststore.pth" = "zabob_retirement_truststore.pth"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Any warning a test doesn't expect fails it, unclosed files and SQLite
# connections included. A test that expects one captures it (pytest.warns,
# or the allow_negative_balance marker); one irrelevant to a test is
# ignored in that test, as narrowly as it can be.
filterwarnings = ["error"]
markers = [
    "uses_current_scenario_write: exempt from the no-op write_current_scenario fixture (see tests/conftest.py)",
    "uses_working_set_write: exempt from the no-op .working_set write fixture (see tests/conftest.py)",
    "allow_negative_balance: the test runs an account short on purpose; the went-negative warning must fire (see tests/conftest.py)",
    "uses_real_cpu_count: exempt from the one-CPU sim run --jobs default fixture (see tests/conftest.py)",
    "slow: takes about a second or more; the local gate runs -m 'not slow', CI runs everything",
    "checkout: needs the code checkout; skipped when the suite runs against an installed wheel (#674)",
    "installed: checks an installed wheel; skipped when the suite runs from a checkout (#674)",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# PLW1514 (#687): text files name their encoding, or Windows reads and
# writes them in its locale's (cp1252), not UTF-8. It is a preview rule, so
# only explicitly selected preview rules are on.
preview = true
explicit-preview-rules = true
select = ["E", "F", "I", "UP", "B", "PLW1514"]
ignore = ["I001", "F541"]

[tool.ruff.lint.per-file-ignores]
# The plugin's scripts are dense one-file tools Claude runs; long lines kept.
"plugins/**" = ["E501"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests", "plugins"]
# The example household tax calculator extends a built-in's nested Params
# class (`class Params(StateTables.Params)`), the documented pattern, which ty
# refuses as an override of a class-literal attribute.
exclude = ["tests/data/sim/tax_calculators/taxes"]
