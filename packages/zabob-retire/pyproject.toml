# zabob-retire: the shorter name, which installs zabob-retirement (#662).
# It has no code of its own; its version always equals zabob-retirement's,
# which it pins (tests/test_release.py checks both).
[project]
name = "zabob-retire"
version = "1.0.0b1"
description = "Installs Zabob Retirement, a retirement simulator for your future (zabob-retirement)"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["zabob-retirement==1.0.0b1"]

[project.urls]
Homepage = "https://github.com/BobKerns/zabob-retirement"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Nothing to ship but the dependency.
bypass-selection = true
