# Native Windows (#687): the program installed as a Windows user installs it,
# and a new user's first session run against it (tests/install), with no
# bash in the way. Native Windows can't be tested anywhere else: nobody
# working on the code has it at hand, and a Windows runner is free for a
# public repository.
#
# By default it installs a wheel built from the commit. "Run workflow" can
# instead install a published version from PyPI, as a user would, to see
# how a release fares (`source: pypi`, `version: 1.0.0b1`).
#
# Like Gates, the promotion pull request (head dev) reuses the push run on
# dev's tip instead of installing again (#759).
#
# Like Gates, it skips a draft pull request, unless it is labeled windows:
# a draft that changes something Windows-specific can be checked as it goes.
name: Windows

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      source:
        description: "What to install: a wheel built from this commit, or a release from PyPI"
        type: choice
        options: [wheel, pypi]
        default: wheel
      version:
        description: "With source pypi: the version (empty for the newest, pre-releases included)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  # Not for a label: one other than windows runs nothing, and mustn't stop the run that is.
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

jobs:
  # A promotion's head is dev's tip, which the push to dev already installed
  # and tested: wait for that run and pass or fail with it. When a later push
  # cancelled it there is nothing to reuse, and the install below runs.
  reuse:
    name: Installed program on Windows (push run on dev)
    if: >-
      ${{ github.event_name == 'pull_request'
          && github.event.action != 'labeled'
          && !github.event.pull_request.draft
          && github.event.pull_request.head.ref == 'dev'
          && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      result: ${{ steps.reuse.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Push run on dev
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          result=$(scripts/push-run-result.sh windows.yml "Installed program on Windows" "$SHA")
          echo "result=$result" >> "$GITHUB_OUTPUT"
          [ "$result" != failed ]

  install:
    name: Installed program on Windows
    needs: reuse
    # !cancelled(): reuse is skipped on everything but a promotion.
    if: >-
      ${{ !cancelled()
          && (needs.reuse.result == 'skipped' || needs.reuse.outputs.result == 'none')
          && (github.event_name != 'pull_request'
              || (github.event.action != 'labeled' && !github.event.pull_request.draft)
              || contains(github.event.pull_request.labels.*.name, 'windows')
                 && (github.event.action != 'labeled' || github.event.label.name == 'windows')) }}
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Pinned, as in gates.yml.
          version: "0.12.23"

      - name: Install the program
        env:
          SOURCE: ${{ inputs.source || 'wheel' }}
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:SOURCE -eq "pypi") {
              # While every release is a pre-release, uv takes the newest one
              # unasked, so this is the install line SETUP.md gives.
              $spec = if ($env:VERSION) { "zabob-retirement==$env:VERSION" } else { "zabob-retirement" }
              uv tool install --python 3.14 $spec
          } else {
              uv build --wheel --out-dir dist
              $wheel = (Get-ChildItem dist/zabob_retirement-*.whl).FullName
              uv tool install --python 3.14 $wheel
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bin = uv tool dir --bin
          "$bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$bin/sim.exe" --help | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv tool list

      - name: Add the test tools
        # Into the installed program's own Python, at versions that keep
        # every package it has: the tests must see what a user's machine got.
        run: |
          $python = Join-Path (uv tool dir) "zabob-retirement/Scripts/python.exe"
          "PROGRAM_PYTHON=$python" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          uv pip freeze --python $python | Out-File -Encoding utf8 installed.txt
          uv run --no-project --python 3.14 python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['dependency-groups']['dev']))" | Out-File -Encoding utf8 test-tools.txt
          uv pip install --quiet --python $python -r test-tools.txt -c installed.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: A new user's first session
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        # The installed package, not src/, is the one imported.
        run: |
          & $env:PROGRAM_PYTHON -m pytest -q -p no:cacheprovider -o pythonpath= tests/install/test_install_native.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: The portable pieces
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        # Locks, process trees and console encodings, which only Windows can
        # show work on Windows.
        run: |
          & $env:PROGRAM_PYTHON -m pytest -q -p no:cacheprovider -o pythonpath= tests/test_oscompat.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
