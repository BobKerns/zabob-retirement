# The verification gates from .github/copilot-instructions.md, run on GitHub so
# a commit made without the local hooks (a fresh clone, a web edit,
# --no-verify) is caught before merge. The rulesets for main and dev require
# three checks: Blocked keywords, Spelling and markdown, and Tests and lint, which
# gathers the test shards and the lint job, so the shard count can change
# without touching the ruleset. They block merging, not pushing. The sixth
# gate, loading the real scenarios, needs the private data repo and stays local.
#
# Pull requests merge into dev, and dev is promoted to main in batches
# (scripts/promote_dev.py). So there are two depths:
#
# - Quick, for a pull request into dev: every check but the whole test suite.
#   It runs the tests the change's areas select (tests/areas.toml); a change
#   that selects the whole suite leaves it to the run on dev, which the
#   author's local gate already ran.
# - Full, for a push to dev or main, a pull request into main (a promotion),
#   a pull request labeled full-gates, and a manual run: the whole suite in
#   four shards.
#
# A run on dev that a later push to dev supersedes is cancelled, so a burst of
# merges costs one full run, on the last of them. A failure there is found
# after merge: scripts/bisect_dev.py finds the merge that caused it.
#
# Every job skips on a draft pull request, where the gates run locally and
# Copilot doesn't review: a draft can't merge. A skipped job still reports its
# required check, and marking the pull request ready (ready_for_review) runs
# everything on that commit.
name: Gates

on:
  pull_request:
    # edited: the title and body are checked too, and can change on their own.
    # labeled/unlabeled: adding or removing full-gates changes the depth. Any
    # other label reruns the same checks, which is harmless.
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  push:
    branches: [main, dev]
  # "Run workflow" on a branch: the full gates on its tip.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its running check, and so does a new
# push to dev. Pushes to main never cancel each other: each run checks only
# its own pushed range.
concurrency:
  group: gates-${{ github.event.pull_request.number || (github.ref == 'refs/heads/dev' && github.event_name == 'push' && 'dev') || github.run_id }}
  cancel-in-progress: true

jobs:
  keywords:
    name: Blocked keywords
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      # The private keyword list (docs/SETUP.md). The check never prints it.
      BLOCKED_KEYWORDS_PRIVATE: ${{ secrets.BLOCKED_KEYWORDS_PRIVATE }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit in the range, for its message.
          fetch-depth: 0

      - name: Private keyword list
        run: |
          if [ -z "$BLOCKED_KEYWORDS_PRIVATE" ]; then
              echo "::warning::The BLOCKED_KEYWORDS_PRIVATE secret is not set; only the public keyword list is checked."
          fi

      - name: Tracked files
        run: scripts/check-blocked-keywords.sh --all

      - name: Commit messages
        # Run every check even after a hit, so one run reports them all.
        if: ${{ !cancelled() }}
        env:
          # Only these SHAs come from the event; never interpolate its text
          # into the script.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          # A force push (or the first push) leaves no usable base, and the
          # pushed range is unknown: fail closed by checking the whole history.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              range="$BASE..$HEAD"
          else
              range="$HEAD"
          fi
          status=0
          for sha in $(git rev-list $range); do
              git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message.txt"
              # --text, not --message: a stored message's '#' lines are not
              # editor comments, and a commit made with -m or -F keeps them.
              if ! scripts/check-blocked-keywords.sh --text "$RUNNER_TEMP/message.txt"; then
                  echo "::error::Blocked keyword in the message of $sha"
                  status=1
              fi
          done
          exit $status

      - name: Pull request title and body
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pr.txt"
          scripts/check-blocked-keywords.sh --text "$RUNNER_TEMP/pr.txt"

  # Which jobs below have work to do. A change that only touches prose or
  # editor settings can't change a lint or type result, so that job skips.
  # The list names what may skip, not what must run, so a new directory is
  # checked by default. Which tests run comes from scripts/affected_tests.py.
  changes:
    name: Changed files
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.changes.outputs.needed }}
      run_tests: ${{ steps.tests.outputs.run }}
      groups: ${{ steps.tests.outputs.groups }}
      paths: ${{ steps.tests.outputs.paths }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit, to list the changed files.
          fetch-depth: 0

      - name: Changed files
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          needed=false
          # With no usable base (a force push, the first push, a manual run)
          # the change is unknown: run everything.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              needed=true
          else
              changed=$(git diff --name-only "$BASE...$HEAD")
              while IFS= read -r path; do
                  case "$path" in
                      "") ;;
                      docs/*|.cspell/*|.vscode/*|.cursor/*|.serena/*) ;;
                      .github/copilot-instructions.md) ;;
                      cspell.json|.markdownlint.json|.markdownlintignore) ;;
                      zabob-retirement.code-workspace|LICENSE) ;;
                      # Markdown elsewhere (a scenario's README.md) is data.
                      */*) needed=true ;;
                      *.md) ;;
                      *) needed=true ;;
                  esac
              done <<< "$changed"
          fi
          echo "Lint and types needed: $needed"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      # The selector needs only the standard library.
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Tests to run
        id: tests
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-gates') }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              selection=$(python scripts/affected_tests.py --list --base "$BASE")
          else
              selection=tests
          fi
          if [ "$EVENT" = pull_request ] && [ "$BASE_REF" = dev ] && [ "$FULL_LABEL" != true ]; then
              depth=quick
          else
              depth=full
          fi
          if [ -z "$selection" ]; then
              echo "No test reads what this change touched."
              run=false groups='[1]' paths=''
          elif [ "$depth" = full ]; then
              echo "Full gates: the whole suite."
              run=true groups='[1, 2, 3, 4]' paths=tests
          elif [ "$selection" = tests ]; then
              echo "The change selects the whole suite: it runs on dev after merge (label full-gates to run it here)."
              run=false groups='[1]' paths=''
          else
              echo "Selected tests:"
              echo "$selection"
              run=true groups='[1]' paths=$(echo $selection)
          fi
          # groups is never empty: GitHub rejects an empty matrix even on a
          # job its condition skips.
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "paths=$paths" >> "$GITHUB_OUTPUT"

  # The selected tests: the whole suite in four parallel shards, or the few
  # files a quick run selected in one. Shards are balanced by the test times in
  # tests/.test_durations (pytest-split). A test missing from that file counts
  # as an average one, so the file only needs refreshing when the shards drift
  # apart: `pytest -n auto --store-durations --durations-path tests/.test_durations`.
  # least_duration deals the longest tests out first, so a few very long ones
  # don't pile into one shard. The runner has no ffmpeg, so the three tests
  # that need it skip here though the file counts them (about 90 s in all).
  tests:
    name: Tests (${{ matrix.group }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ needs.changes.outputs.run_tests == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one run lists every failure.
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          # Pinned: an unpinned setup asks the GitHub API for the latest
          # release on every run, and fails the job when that times out.
          version: "0.12.23"
          enable-cache: true

      - name: Install Python and dependencies
        # uv reads the pinned version from .python-version.
        run: |
          uv python install
          uv sync --locked --group dev

      # The same data/private layout a developer has, from templates/.
      - name: Template data repo
        run: scripts/link-data.sh --template

      - name: Tests
        env:
          # Test file paths from the selector, space-separated.
          TEST_PATHS: ${{ needs.changes.outputs.paths }}
        run: >-
          uv run --no-sync python -m pytest -q -n auto
          --splits ${{ strategy.job-total }} --group ${{ matrix.group }}
          --splitting-algorithm least_duration
          --durations-path tests/.test_durations
          $TEST_PATHS

  lint:
    name: Lint and types
    needs: changes
    if: ${{ needs.changes.outputs.needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked --group dev

      - name: Lint
        run: uv run --no-sync ruff check src tests plugins

      - name: Types
        # Run even when lint fails, so one run reports both.
        if: ${{ !cancelled() }}
        run: uv run --no-sync ty check

  # The required check. It passes when the shards and lint passed, or when
  # the change needed none of them; the rulesets name only this job, so the
  # shard count can change without touching them.
  python:
    name: Tests and lint
    needs: [changes, tests, lint]
    # !cancelled(), not always(): a run superseded by a newer push (or a title
    # edit) shows as cancelled rather than failed.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    steps:
      - name: Results
        env:
          CHANGES: ${{ needs.changes.result }}
          NEEDED: ${{ needs.changes.outputs.needed }}
          RUN_TESTS: ${{ needs.changes.outputs.run_tests }}
          TESTS: ${{ needs.tests.result }}
          LINT: ${{ needs.lint.result }}
        run: |
          echo "Changed files: $CHANGES (lint needed: $NEEDED, tests needed: $RUN_TESTS)"
          echo "Tests: $TESTS"
          echo "Lint and types: $LINT"
          if [ "$CHANGES" != success ]; then exit 1; fi
          if [ "$NEEDED" = true ] && [ "$LINT" != success ]; then exit 1; fi
          if [ "$RUN_TESTS" = true ] && [ "$TESTS" != success ]; then exit 1; fi

  # Work merges into dev; only a promotion (head dev) or a hotfix (labeled
  # hotfix) goes straight to main. Not a required check: it makes a pull
  # request opened against the wrong base loud, and retargeting it to dev
  # clears it.
  base:
    name: Base branch
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Promotion or hotfix
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HOTFIX: ${{ contains(github.event.pull_request.labels.*.name, 'hotfix') }}
        run: |
          if [ "$HEAD_REF" != dev ] && [ "$HOTFIX" != true ]; then
              echo "::error::Pull requests go to dev; only dev's promotion or a hotfix (label hotfix) goes to main. Edit the pull request's base to dev."
              exit 1
          fi

  docs:
    name: Spelling and markdown
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --no-audit --no-fund

      # CI has no data repo, so this builds data/private from templates/,
      # including the empty dictionary cspell.json loads. Tracked files never
      # use the data repo's names, so nothing here needs its words.
      - name: Template data repo
        run: scripts/link-data.sh --template

      - name: Spelling
        run: npm run spell

      - name: Markdown
        run: npm run markdownlint
