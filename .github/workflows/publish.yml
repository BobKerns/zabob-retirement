# Publish zabob-retirement and zabob-retire to PyPI (#662), with trusted
# publishing: PyPI trusts this workflow, by name, in the environments below,
# so no token is stored anywhere.
#
# - TestPyPI (environment testpypi): a manual run, or a pushed pre-release tag
#   (v1.0.0b1, v1.1.0rc1, v1.2.0a1).
# - PyPI (environment pypi): a published GitHub release, only.
#
# Nothing runs on ordinary pushes, to spare Actions minutes. A version can be
# uploaded once per index, ever: bump pyproject.toml (both packages) first.
name: Publish

on:
  workflow_dispatch:
  push:
    tags: ["v*a*", "v*b*", "v*rc*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit the wheel is stamped with needs no history; a shallow
          # clone has HEAD.
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v7
        with:
          # Pinned, as in gates.yml.
          version: "0.12.23"

      - name: Check the versions agree
        env:
          # Only the ref name comes from the event; never its text.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          retire="$(uv version --short --directory packages/zabob-retire)"
          [ "$retire" = "$version" ] || { echo "::error::zabob-retire is $retire, zabob-retirement is $version"; exit 1; }
          grep -qxF "dependencies = [\"zabob-retirement==$version\"]" packages/zabob-retire/pyproject.toml || \
              { echo "::error::zabob-retire doesn't pin zabob-retirement==$version"; exit 1; }
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME doesn't match version $version (expected v$version)"
              exit 1
          fi
          echo "Publishing $version"

      - name: Build both packages
        # The wheel is built from the sdist, as a user building from it would.
        run: |
          uv build --out-dir dist
          uv build --out-dir dist packages/zabob-retire

      - name: Check the wheel installs and runs with no checkout
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/check"
          uv pip install --python "$RUNNER_TEMP/check/bin/python" dist/zabob_retirement-*.whl
          cd "$RUNNER_TEMP"
          ANALYSIS_NO_BUILDER=1 GIT_CONFIG_GLOBAL=/dev/null \
              GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.com \
              GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.com \
              "$RUNNER_TEMP/check/bin/sim" init --example "$RUNNER_TEMP/example"
          ANALYSIS_NO_BUILDER=1 "$RUNNER_TEMP/check/bin/sim" check --all --data-dir "$RUNNER_TEMP/example/sim"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/zabob-retirement/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      # zabob-retirement goes up first, on its own: zabob-retire depends on
      # it, and a pending trusted publisher can create only one project, so
      # zabob-retire's can be added only once zabob-retirement exists (#699).
      # (zabob_retire-* doesn't match zabob_retirement-*.)
      - name: Split the two packages
        run: |
          mkdir -p dist-retirement dist-retire
          mv dist/zabob_retirement-* dist-retirement/
          mv dist/zabob_retire-* dist-retire/

      - name: Upload zabob-retirement
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-retirement/
          repository-url: https://test.pypi.org/legacy/
          # A release's tag push and the manual run before it can carry
          # one version twice; TestPyPI keeps the first.
          skip-existing: true

      - name: Upload zabob-retire
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-retire/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: build
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/zabob-retirement/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      # zabob-retirement first, as for TestPyPI.
      - name: Split the two packages
        run: |
          mkdir -p dist-retirement dist-retire
          mv dist/zabob_retirement-* dist-retirement/
          mv dist/zabob_retire-* dist-retire/

      - name: Upload zabob-retirement
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-retirement/
          # A re-run after zabob-retire failed finds this one already there.
          skip-existing: true

      - name: Upload zabob-retire
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-retire/
