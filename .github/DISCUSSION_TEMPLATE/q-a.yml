title: "[Q&A] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Keep your finances private.** This is a public forum. Don't post real
        balances, account names or numbers, people's names, employers, or
        anything copied from your data repository or a statement.

        Describe the problem with the example household instead (Alice and
        Bill, from `prototype_data/`) or with made-up round figures. If a
        scenario file shows the problem, cut it down to a few rows and change
        the names and amounts first.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to see it
      description: >-
        Commands you ran, and a cut-down scenario using made-up names and
        amounts. Paste output as text, with any real figures removed.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you installed (`pip show zabob-retirement`), or the commit you're on.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: >-
            I've left out real balances, names and account details.
          required: true
