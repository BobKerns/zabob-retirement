# Keeps the actions in .github/workflows current (#733). Every `uses:` is
# pinned to a full commit SHA with its release as a trailing comment
# (`@<sha>  # v7.0.1`); Dependabot moves the SHA and rewrites the comment
# together. tests/test_workflows.py fails on a `uses:` that isn't pinned.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Work merges into dev; main gets it at the next promotion.
    target-branch: dev
    schedule:
      interval: weekly
    # A release has to be out a week before it's proposed: a hijacked tag is
    # usually caught and pulled within days.
    cooldown:
      default-days: 7
    # One pull request a week for all of them, not one per action.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Actions"
